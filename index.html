<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deutsch mit Saher – A1 Verben</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f5fb;color:#14233e;font-family:system-ui,-apple-system,Arial}.wrap{max-width:680px;margin:auto;padding:18px}header{background:linear-gradient(135deg,#10274d,#235a9e);color:white;border-radius:22px;padding:25px}h1{margin:0 0 8px;font-size:27px}header p{margin:0;opacity:.85}.stats{margin-top:18px;display:flex;gap:10px}.stats span{background:#ffffff20;padding:9px 14px;border-radius:12px}nav{display:flex;gap:8px;margin:18px 0}button{cursor:pointer;font:inherit;border:0;border-radius:12px;padding:12px 15px}nav button{flex:1;background:white;color:#19355d}nav button.active,.primary{background:#245fba;color:white}input{width:100%;border:1px solid #d6dfec;border-radius:12px;padding:14px;font-size:16px;margin-bottom:12px}.item{display:flex;align-items:center;justify-content:space-between;background:white;padding:15px;border-radius:14px;margin:8px 0;box-shadow:0 1px 3px #0000000a}.de{font-size:20px;font-weight:750;direction:ltr;text-align:left}.ar{color:#52637b;margin-top:4px}.heart{background:#edf3fc;color:#245fba}.card{background:white;border-radius:18px;padding:22px;margin:14px 0}.big{font-size:34px;direction:ltr;font-weight:800;text-align:center;margin:20px}.choice{width:100%;background:#eef3fa;margin:6px 0;text-align:right}.correct{background:#c8efd8}.wrong{background:#ffd6d6}.muted{color:#61718b}#list{max-height:62vh;overflow:auto}.hidden{display:none}.toolbar{display:flex;gap:8px}.toolbar button{flex:1}.note{font-size:13px;color:#64748b;margin-top:20px}</style></head><body><div class="wrap"><header><h1>Deutsch mit Saher 🇩🇪</h1><p>الأفعال الألمانية — مستوى A1</p><div class="stats"><span>150 فعلًا</span><span id="savedCount">المفضلة: 0</span><span id="score">الصحيح: 0</span></div></header><nav><button class="active" onclick="tab('words',this)">الأفعال</button><button onclick="tab('favorites',this)">المفضلة</button><button onclick="tab('quiz',this)">اختبار</button></nav><section id="words"><input id="search" placeholder="ابحث بالألمانية أو العربية..." oninput="render()"><div id="list"></div></section><section id="quiz" class="hidden"><div class="card"><div class="muted">اختر الترجمة الصحيحة</div><div id="qword" class="big"></div><div id="choices"></div><p id="feedback"></p><button class="primary" onclick="next()">السؤال التالي ←</button></div></section><p class="note">قائمة تدريبية من 150 فعلًا وتعبيرًا فعليًا شائعًا للمبتدئين، وليست قائمة رسمية حصرية لامتحان A1. يعمل التطبيق دون إنترنت بعد حفظ الملف على الجهاز.</p></div><script>const data=[["sein", "يكون"], ["haben", "يملك"], ["werden", "يصبح"], ["heißen", "يُدعى"], ["kommen", "يأتي"], ["gehen", "يذهب"], ["fahren", "يذهب بالمركبة"], ["laufen", "يمشي أو يركض"], ["wohnen", "يسكن"], ["leben", "يعيش"], ["bleiben", "يبقى"], ["arbeiten", "يعمل"], ["lernen", "يتعلم"], ["studieren", "يدرس في الجامعة"], ["machen", "يفعل"], ["spielen", "يلعب"], ["kaufen", "يشتري"], ["verkaufen", "يبيع"], ["bezahlen", "يدفع"], ["kosten", "يكلّف"], ["brauchen", "يحتاج"], ["suchen", "يبحث"], ["finden", "يجد"], ["nehmen", "يأخذ"], ["geben", "يعطي"], ["bringen", "يجلب"], ["holen", "يحضر"], ["bekommen", "يحصل على"], ["essen", "يأكل"], ["trinken", "يشرب"], ["kochen", "يطبخ"], ["backen", "يخبز"], ["schmecken", "يكون طعمه"], ["frühstücken", "يتناول الفطور"], ["bestellen", "يطلب"], ["schlafen", "ينام"], ["aufstehen", "ينهض"], ["aufwachen", "يستيقظ"], ["sitzen", "يجلس"], ["stehen", "يقف"], ["liegen", "يستلقي"], ["legen", "يضع بشكل أفقي"], ["stellen", "يضع بشكل عمودي"], ["setzen", "يُجلس"], ["öffnen", "يفتح"], ["schließen", "يغلق"], ["zumachen", "يغلق"], ["aufmachen", "يفتح"], ["lesen", "يقرأ"], ["schreiben", "يكتب"], ["sprechen", "يتحدث"], ["sagen", "يقول"], ["fragen", "يسأل"], ["antworten", "يجيب"], ["hören", "يسمع"], ["zuhören", "يصغي"], ["sehen", "يرى"], ["anschauen", "يشاهد"], ["zeigen", "يُري"], ["verstehen", "يفهم"], ["erklären", "يشرح"], ["wiederholen", "يكرر"], ["buchstabieren", "يتهجّى"], ["üben", "يتدرّب"], ["wissen", "يعرف معلومة"], ["kennen", "يعرف شخصًا أو مكانًا"], ["denken", "يفكر"], ["glauben", "يعتقد"], ["meinen", "يقصد"], ["vergessen", "ينسى"], ["merken", "يتذكر أو يلاحظ"], ["lieben", "يحب"], ["mögen", "يعجبه"], ["wollen", "يريد"], ["möchten", "يودّ"], ["können", "يستطيع"], ["müssen", "يجب عليه"], ["dürfen", "يُسمح له"], ["sollen", "ينبغي عليه"], ["helfen", "يساعد"], ["warten", "ينتظر"], ["besuchen", "يزور"], ["treffen", "يلتقي"], ["anrufen", "يتصل هاتفيًا"], ["telefonieren", "يتحدث بالهاتف"], ["schicken", "يرسل"], ["senden", "يرسل"], ["feiern", "يحتفل"], ["tanzen", "يرقص"], ["singen", "يغني"], ["lachen", "يضحك"], ["weinen", "يبكي"], ["reisen", "يسافر"], ["fliegen", "يطير"], ["ankommen", "يصل"], ["abfahren", "ينطلق"], ["abholen", "يستقبل أو يصطحب"], ["einsteigen", "يصعد إلى وسيلة نقل"], ["aussteigen", "ينزل من وسيلة نقل"], ["umsteigen", "يغيّر وسيلة النقل"], ["parken", "يركن السيارة"], ["halten", "يتوقف أو يمسك"], ["tragen", "يحمل أو يرتدي"], ["anziehen", "يرتدي"], ["ausziehen", "يخلع الملابس"], ["waschen", "يغسل"], ["duschen", "يستحم بالدش"], ["baden", "يستحم"], ["putzen", "ينظف"], ["aufräumen", "يرتب"], ["reinigen", "ينظف"], ["spülen", "يغسل الأواني"], ["einkaufen", "يتسوق"], ["mitbringen", "يحضر معه"], ["mitnehmen", "يأخذ معه"], ["aufpassen", "ينتبه"], ["passen", "يناسب"], ["gefallen", "يعجب"], ["gehören", "يخصّ"], ["benutzen", "يستخدم"], ["funktionieren", "يعمل أو يشتغل"], ["reparieren", "يصلح"], ["wechseln", "يبدّل"], ["ändern", "يغيّر"], ["beginnen", "يبدأ"], ["anfangen", "يبدأ"], ["enden", "ينتهي"], ["aufhören", "يتوقف"], ["planen", "يخطط"], ["reservieren", "يحجز"], ["buchen", "يحجز"], ["mieten", "يستأجر"], ["unterschreiben", "يوقّع"], ["ausfüllen", "يملأ استمارة"], ["zahlen", "يدفع"], ["sparen", "يدّخر"], ["verdienen", "يكسب مالًا"], ["gewinnen", "يفوز"], ["verlieren", "يخسر"], ["schwimmen", "يسبح"], ["Rad fahren", "يركب الدراجة"], ["Fußball spielen", "يلعب كرة القدم"], ["fotografieren", "يصوّر"], ["malen", "يرسم أو يلوّن"], ["zeichnen", "يرسم"], ["basteln", "يصنع أشغالًا يدوية"], ["schneiden", "يقطع"], ["probieren", "يجرب"], ["fühlen", "يشعر"], ["hoffen", "يأمل"]];let fav=JSON.parse(localStorage.getItem('saherFav')||'[]'),score=0,q=0,answered=false,mode='words';function tab(t,el){mode=t;document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.getElementById('words').classList.toggle('hidden',t==='quiz');document.getElementById('quiz').classList.toggle('hidden',t!=='quiz');document.getElementById('search').value='';render();if(t==='quiz')question()}function render(){document.getElementById('savedCount').textContent='المفضلة: '+fav.length;document.getElementById('score').textContent='الصحيح: '+score;let s=document.getElementById('search').value.toLowerCase();document.getElementById('list').innerHTML=data.map((v,i)=>({v,i})).filter(o=>(mode!=='favorites'||fav.includes(o.i))&&(o.v[0].toLowerCase().includes(s)||o.v[1].includes(s))).map(o=>`<div class="item"><div><div class="de">${o.v[0]}</div><div class="ar">${o.v[1]}</div></div><div class="toolbar"><button onclick="speak(${o.i})" title="استمع">🔊</button><button class="heart" onclick="toggle(${o.i})">${fav.includes(o.i)?'★':'☆'}</button></div></div>`).join('')||'<p>لا توجد نتائج</p>'}function toggle(i){fav=fav.includes(i)?fav.filter(x=>x!==i):[...fav,i];localStorage.setItem('saherFav',JSON.stringify(fav));render()}function speak(i){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(data[i][0]);u.lang='de-DE';u.rate=.8;speechSynthesis.speak(u)}}function question(){answered=false;document.getElementById('feedback').textContent='';document.getElementById('qword').textContent=data[q][0];let choices=[q,(q+19)%150,(q+47)%150,(q+83)%150].sort((a,b)=>((a*13+q*7)%17)-((b*13+q*7)%17));document.getElementById('choices').innerHTML=choices.map(i=>`<button class="choice" onclick="check(this,${i})">${data[i][1]}</button>`).join('')}function check(el,i){if(answered)return;answered=true;el.classList.add(i===q?'correct':'wrong');if(i===q)score++;document.getElementById('feedback').textContent=i===q?'أحسنت! إجابة صحيحة ✓':'الإجابة الصحيحة: '+data[q][1];renderScore()}function renderScore(){document.getElementById('score').textContent='الصحيح: '+score}function next(){q=(q+1)%150;question()}render();</script></body></html>
